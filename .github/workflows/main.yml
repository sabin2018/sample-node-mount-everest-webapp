name: Deploy to Alibaba Cloud ECI

on:
  push:
    branches:
      - ali
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1 # Using the dedicated ACR login action
        with:
          login-server: 'https://registry-intl.ap-northeast-1.aliyuncs.com'
          region-id: 'ap-northeast-1'
          access-key-id: ${{ env.ALIBABA_ACCESS_KEY_ID }}
          access-key-secret: ${{ env.ALIBABA_ACCESS_KEY_SECRET }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ECI_IMAGE_NAME }}:latest .
          docker push ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ECI_IMAGE_NAME }}:latest

      - name: Install Alibaba Cloud CLI
        run: |
          curl -L https://aliyuncli.alicdn.com/install.sh | bash
          echo "$HOME/.aliyuncli/bin" >> $GITHUB_PATH

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set --profile default --access-key-id ${{ secrets.ALIBABA_ACCESS_KEY_ID }} --access-key-secret ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }} --region ${{ secrets.ALIBABA_REGION }}

      - name: Deploy to ECI
        run: |
          eci_instance_id=$(aliyun eci create-container-group \
            --region ${{ secrets.ALIBABA_REGION }} \
            --vswitch-id ${{ secrets.ECI_VSWITCH_ID }} \
            --security-group-id ${{ secrets.ECI_SECURITY_GROUP_ID }} \
            --container.1.image ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ECI_IMAGE_NAME }}:latest \
            --container.1.name ${{ secrets.ECI_CONTAINER_NAME }} \
            --cpu ${{ secrets.ECI_CPU }} \
            --memory ${{ secrets.ECI_MEMORY }} \
            --output json | jq -r '.ContainerGroupId')
          echo "ECI Instance ID: $eci_instance_id"

      - name: Check ECI Status
        run: |
          aliyun eci describe-container-group --region ${{ secrets.ALIBABA_REGION }} --container-group-id $eci_instance_id