name: Deploy to Alibaba Cloud ECI

on:
  push:
    branches:
      - ali
  workflow_dispatch: # Manual trigger allowed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      FULL_IMAGE_NAME_WITH_TAG: registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr
          region-id: 'ap-northeast-1'
          access-key-id: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          username: "${{ secrets.ACR_USERNAME }}"
          password: "${{ secrets.ACR_PASSWORD }}"

      - name: Build and Push Docker Image
        run: |
          docker build -t $FULL_IMAGE_NAME_WITH_TAG .
          docker push $FULL_IMAGE_NAME_WITH_TAG

      - name: Install Alibaba Cloud CLI and jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          curl -L https://aliyuncli.alicdn.com/install.sh | bash
          echo "$HOME/.aliyuncli/bin" >> $GITHUB_PATH

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set --profile default \
            --access-key-id ${{ secrets.ALIBABA_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }} \
            --region ${{ secrets.ALIBABA_REGION }}

      - name: Deploy to ECI (create or update)
        env:
          REGION_ID: ${{ secrets.ALIBABA_REGION }}
          CONTAINER_GROUP_NAME: ${{ secrets.ECI_CONTAINER_GROUP_NAME }}
          CONTAINER_NAME: ${{ secrets.ECI_CONTAINER_NAME }}
          IMAGE: ${{ env.FULL_IMAGE_NAME_WITH_TAG }}
          VSWITCH_ID: ${{ secrets.ECI_VSWITCH_ID }}
          SECURITY_GROUP_ID: ${{ secrets.ECI_SECURITY_GROUP_ID }}
          CPU: ${{ secrets.ECI_CPU }}
          MEMORY: ${{ secrets.ECI_MEMORY }}
        run: |
          echo "🔍 Checking for existing container group..."
          GROUP_INFO=$(aliyun eci DescribeContainerGroups \
            --RegionId "$REGION_ID" \
            --ContainerGroupName "$CONTAINER_GROUP_NAME" \
            --output json)

          CONTAINER_GROUP_ID=$(echo "$GROUP_INFO" | jq -r '.ContainerGroups[0].ContainerGroupId // empty')
          CURRENT_STATUS=$(echo "$GROUP_INFO" | jq -r '.ContainerGroups[0].Status // empty')

          if [ -n "$CONTAINER_GROUP_ID" ] && [ "$CURRENT_STATUS" = "Running" ]; then
            echo "🟢 Container group found and running. Updating container image..."
            UPDATE_RESULT=$(aliyun eci UpdateContainerGroup \
              --RegionId "$REGION_ID" \
              --ContainerGroupId "$CONTAINER_GROUP_ID" \
              --Container.1.Name "$CONTAINER_NAME" \
              --Container.1.Image "$IMAGE" \
              --Container.1.Cpu "$CPU" \
              --Container.1.Memory "$MEMORY" \
              --RestartPolicy Always \
              --output json)

            if [ $? -ne 0 ]; then
              echo "::error:: Failed to update existing ECI container group."
              exit 1
            fi
            echo "✅ ECI container group updated: $CONTAINER_GROUP_ID"

          else
            echo "🔄 Container group not found or not running. Creating new container group..."
            CREATE_RESULT=$(aliyun eci CreateContainerGroup \
              --RegionId "$REGION_ID" \
              --ContainerGroupName "$CONTAINER_GROUP_NAME" \
              --Container.1.Name "$CONTAINER_NAME" \
              --Container.1.Image "$IMAGE" \
              --Container.1.Cpu "$CPU" \
              --Container.1.Memory "$MEMORY" \
              --VSwitchId "$VSWITCH_ID" \
              --SecurityGroupId "$SECURITY_GROUP_ID" \
              --Container.1.Port 80 \
              --RestartPolicy Always \
              --output json)

            if [ $? -ne 0 ]; then
              echo "::error:: Failed to create new ECI container group."
              exit 1
            fi
            NEW_GROUP_ID=$(echo "$CREATE_RESULT" | jq -r '.ContainerGroupId')
            echo "✅ Created new ECI container group: $NEW_GROUP_ID"
          fi
