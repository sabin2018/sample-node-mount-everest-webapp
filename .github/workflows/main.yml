name: Deploy to Alibaba Cloud ECI

on:
  push:
    branches:
      - ali
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr
          region-id: 'ap-northeast-1'
          access-key-id: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          username: "${{ secrets.ACR_USERNAME }}"
          password: "${{ secrets.ACR_PASSWORD }}"
      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG .
          docker push registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG

      - name: Install Alibaba Cloud CLI
        run: |
          curl -L https://aliyuncli.alicdn.com/install.sh | bash
          echo "$HOME/.aliyuncli/bin" >> $GITHUB_PATH

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set --profile default \
            --access-key-id ${{ secrets.ALIBABA_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }} \
            --region ${{ secrets.ALIBABA_REGION }}

      - name: Check Existing Container Group
        id: check_container
        run: |
          # Check if container group exists with the specified name
          echo "Checking for existing container group: ${{ secrets.ECI_CONTAINER_NAME }}"
          
          # First try to get container group by name
          eci_info=$(aliyun eci DescribeContainerGroups \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupName ${{ secrets.ECI_CONTAINER_NAME }} \
            --output cols=ContainerGroupId,Status || true)

          # Extract container group ID and status
          container_group_id=$(echo "$eci_info" | awk 'NR==2 {print $1}')
          container_status=$(echo "$eci_info" | awk 'NR==2 {print $2}')

          echo "Container Group ID: $container_group_id"
          echo "Container Status: $container_status"

          # Set outputs for subsequent steps
          echo "container_group_id=$container_group_id" >> $GITHUB_OUTPUT
          echo "container_status=$container_status" >> $GITHUB_OUTPUT

      - name: Update Existing Container
        if: steps.check_container.outputs.container_group_id != '' && steps.check_container.outputs.container_status == 'Running'
        run: |
          echo "Updating existing container with new image..."
          echo "Container Group ID: ${{ steps.check_container.outputs.container_group_id }}"
          
          aliyun eci UpdateContainerGroup \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupId ${{ steps.check_container.outputs.container_group_id }} \
            --Container.1.Image registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:${{ github.sha }} \
            --Container.1.Name ${{ secrets.ECI_CONTAINER_NAME }}

      - name: Create New Container
        if: steps.check_container.outputs.container_group_id == '' || steps.check_container.outputs.container_status != 'Running'
        run: |
          echo "Creating new container group..."
          echo "Container Name: ${{ secrets.ECI_CONTAINER_NAME }}"
          echo "CPU: ${{ secrets.ECI_CPU }}"
          echo "Memory: ${{ secrets.ECI_MEMORY }}"
          echo "VSwitch ID: ${{ secrets.ECI_VSWITCH_ID }}"
          echo "Security Group ID: ${{ secrets.ECI_SECURITY_GROUP_ID }}"
          
          # Create new container group
          eci_instance_id=$(aliyun eci CreateContainerGroup \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupName ${{ secrets.ECI_CONTAINER_NAME }} \
            --Container.1.Image registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:${{ github.sha }} \
            --Container.1.Name ${{ secrets.ECI_CONTAINER_NAME }} \
            --Container.1.Cpu ${{ secrets.ECI_CPU }} \
            --Container.1.Memory ${{ secrets.ECI_MEMORY }} \
            --VSwitchId ${{ secrets.ECI_VSWITCH_ID }} \
            --SecurityGroupId ${{ secrets.ECI_SECURITY_GROUP_ID }} \
            --Container.1.Port.1.Port 80 \
            --Container.1.Port.1.Protocol TCP \
            --RestartPolicy Always \
            --output text cols=ContainerGroupId,RequestId)

          echo "New ECI Instance ID: $eci_instance_id"

      - name: Verify Container Status
        run: |
          if [ -n "${{ steps.check_container.outputs.container_group_id }}" ]; then
            container_id="${{ steps.check_container.outputs.container_group_id }}"
          else
            container_id=$(echo "$eci_instance_id" | awk '{print $1}')
          fi
          
          echo "Checking status for container: $container_id"
          aliyun eci DescribeContainerGroupStatus \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupIds $container_id \
            --output cols=Status
