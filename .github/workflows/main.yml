name: Deploy to Alibaba Cloud ECI

on:
  push:
    branches:
      - aliacs
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry-intl.ap-northeast-1.aliyuncs.com/demogc/demok8s
          region-id: 'ap-northeast-1'
          access-key-id: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          username: "${{ secrets.ACR_USERNAME }}"
          password: "${{ secrets.ACR_PASSWORD }}"

      - name: Build and push image
        id: build_image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t registry-intl.ap-northeast-1.aliyuncs.com/demogc/demok8s:$IMAGE_TAG .
          docker push registry-intl.ap-northeast-1.aliyuncs.com/demogc/demok8s:$IMAGE_TAG
          
          # Store the full image name with tag for later use
          echo "FULL_IMAGE_NAME_WITH_TAG=registry-intl.ap-northeast-1.aliyuncs.com/demogc/demok8s:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Install Alibaba Cloud CLI
        run: |
          curl -L https://aliyuncli.alicdn.com/install.sh | bash
          echo "$HOME/.aliyuncli/bin" >> $GITHUB_PATH

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set --profile default \
            --access-key-id ${{ secrets.ALIBABA_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }} \
            --region ${{ secrets.ALIBABA_REGION }}
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.ACS_KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
      - name: Deploy to ACK
        run: |
          echo "📦 Applying deployment.yaml to Alibaba Cloud ACS Cluster..."
          kubectl apply -f demoacs/test.yaml

      - name: Check Deployment Status
        run: |
          echo "🔍 Checking status of pods..."
          kubectl get pods -o wide