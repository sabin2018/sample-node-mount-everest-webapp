name: Deploy to Alibaba Cloud ECI

on:
  push:
    branches:
      - ali
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr
          region-id: 'ap-northeast-1'
          access-key-id: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          username: "${{ secrets.ACR_USERNAME }}"
          password: "${{ secrets.ACR_PASSWORD }}"
      - name: Build and push image
        id: build_image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG .
          docker push registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG
          
          # Store the full image name with tag for later use
          echo "FULL_IMAGE_NAME_WITH_TAG=registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Install Alibaba Cloud CLI
        run: |
          curl -L https://aliyuncli.alicdn.com/install.sh | bash
          echo "$HOME/.aliyuncli/bin" >> $GITHUB_PATH

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set --profile default \
            --access-key-id ${{ secrets.ALIBABA_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }} \
            --region ${{ secrets.ALIBABA_REGION }}

      - name: Check Existing Container Group
        id: check_container
        run: |
          echo "Checking for existing container group: ${{ secrets.ECI_CONTAINER_GROUP_NAME }}"
          
          # Query for container group with error handling
          eci_info=$(aliyun eci DescribeContainerGroups \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupName ${{ secrets.ECI_CONTAINER_GROUP_NAME }} \
            --output cols=ContainerGroupId,Status 2>&1 || true)

          # Check if the output contains the expected format
          if echo "$eci_info" | grep -q "ContainerGroupId"; then
            # Extract container group ID and status
            container_group_id=$(echo "$eci_info" | awk 'NR==2 {print $1}')
            container_status=$(echo "$eci_info" | awk 'NR==2 {print $2}')
            
            echo "Found existing container group:"
            echo "Container Group ID: $container_group_id"
            echo "Container Status: $container_status"
          else
            echo "No existing container group found"
            container_group_id=""
            container_status=""
          fi

          # Set outputs for subsequent steps
          echo "container_group_id=$container_group_id" >> $GITHUB_OUTPUT
          echo "container_status=$container_status" >> $GITHUB_OUTPUT

      - name: Update Existing Container
        if: steps.check_container.outputs.container_group_id != '' && steps.check_container.outputs.container_status == 'Running'
        run: |
          echo "Updating existing container with new image..."
          echo "Container Group ID: ${{ steps.check_container.outputs.container_group_id }}"
          echo "New Image: ${{ env.FULL_IMAGE_NAME_WITH_TAG }}"
          
          # Update the container group
          update_output=$(aliyun eci UpdateContainerGroup \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupId ${{ steps.check_container.outputs.container_group_id }} \
            --Container.1.Image ${{ env.FULL_IMAGE_NAME_WITH_TAG }} \
            --Container.1.Name ${{ secrets.ECI_CONTAINER_NAME }} 2>&1 || true)

          if echo "$update_output" | grep -q "error"; then
            echo "::error::Failed to update container: $update_output"
            exit 1
          fi
          
          echo "Container updated successfully"

      - name: Create New Container
        if: steps.check_container.outputs.container_group_id == '' || steps.check_container.outputs.container_status != 'Running'
        run: |
          echo "Creating new container group..."
          echo "Container Group Name: ${{ secrets.ECI_CONTAINER_GROUP_NAME }}"
          echo "Container Name: ${{ secrets.ECI_CONTAINER_NAME }}"
          echo "Image: ${{ env.FULL_IMAGE_NAME_WITH_TAG }}"
          echo "CPU: ${{ secrets.ECI_CPU }}"
          echo "Memory: ${{ secrets.ECI_MEMORY }}"
          echo "VSwitch ID: ${{ secrets.ECI_VSWITCH_ID }}"
          echo "Security Group ID: ${{ secrets.ECI_SECURITY_GROUP_ID }}"
          
          # Create new container group
          create_output=$(aliyun eci CreateContainerGroup \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupName ${{ secrets.ECI_CONTAINER_GROUP_NAME }} \
            --Container.1.Image ${{ env.FULL_IMAGE_NAME_WITH_TAG }} \
            --Container.1.Name ${{ secrets.ECI_CONTAINER_NAME }} \
            --Container.1.Cpu ${{ secrets.ECI_CPU }} \
            --Container.1.Memory ${{ secrets.ECI_MEMORY }} \
            --VSwitchId ${{ secrets.ECI_VSWITCH_ID }} \
            --SecurityGroupId ${{ secrets.ECI_SECURITY_GROUP_ID }} \
            --Container.1.Port.1.Port 80 \
            --Container.1.Port.1.Protocol TCP \
            --RestartPolicy Always \
            --output text cols=ContainerGroupId,RequestId 2>&1 || true)

          if echo "$create_output" | grep -q "error"; then
            echo "::error::Failed to create container: $create_output"
            exit 1
          fi
          
          # Extract container group ID
          container_group_id=$(echo "$create_output" | awk '{print $1}')
          echo "New container group created with ID: $container_group_id"

      - name: Verify Container Status
        run: |
          # Get the container ID from either check or create step
          if [ -n "${{ steps.check_container.outputs.container_group_id }}" ]; then
            container_id="${{ steps.check_container.outputs.container_group_id }}"
          else
            container_id=$(echo "$create_output" | awk '{print $1}')
          fi

          if [ -z "$container_id" ]; then
            echo "::error::No container ID available for status check"
            exit 1
          fi

          echo "Checking status for container: $container_id"
          status_output=$(aliyun eci DescribeContainerGroupStatus \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupIds $container_id \
            --output cols=Status 2>&1 || true)

          if echo "$status_output" | grep -q "error"; then
            echo "::error::Failed to check container status: $status_output"
            exit 1
          fi

          echo "Container status: $status_output"
