name: Deploy to Alibaba Cloud ECI

on:
  push:
    branches:
      - ali
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr
          region-id: 'ap-northeast-1'
          access-key-id: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          username: "${{ secrets.ACR_USERNAME }}"
          password: "${{ secrets.ACR_PASSWORD }}"

      - name: Build and push image
        id: build_image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG .
          docker push registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG
          
          # Store the full image name with tag for later use
          echo "FULL_IMAGE_NAME_WITH_TAG=registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Install Alibaba Cloud CLI
        run: |
          curl -L https://aliyuncli.alicdn.com/install.sh | bash
          echo "$HOME/.aliyuncli/bin" >> $GITHUB_PATH

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set --profile default \
            --access-key-id ${{ secrets.ALIBABA_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }} \
            --region ${{ secrets.ALIBABA_REGION }}

      - name: Check ECI Container Status
        id: check_eci
        run: |
          # Install jq if not already installed
          sudo apt-get update && sudo apt-get install -y jq

          # Get container group ID and status
          CONTAINER_INFO=$(aliyun eci DescribeContainerGroups \
            --RegionId ${{ secrets.ALIBABA_REGION }} | \
            jq -r '.ContainerGroups[] | select(.ContainerGroupName == "'${{ secrets.ECI_CONTAINER_NAME }}'") | {id: .ContainerGroupId, status: .Status}')

          # Debug output
          echo "Container Info: $CONTAINER_INFO"

          if [[ -n "$CONTAINER_INFO" ]]; then
            CONTAINER_GROUP_ID=$(echo "$CONTAINER_INFO" | jq -r '.id')
            STATUS=$(echo "$CONTAINER_INFO" | jq -r '.status')
            
            echo "Container Group ID: $CONTAINER_GROUP_ID"
            echo "Container status: $STATUS"
            
            if [[ "$STATUS" == "Running" ]]; then
              echo "Found running container"
              echo "ECI_STATUS=Running" >> $GITHUB_ENV
              echo "CONTAINER_GROUP_ID=$CONTAINER_GROUP_ID" >> $GITHUB_ENV
            else
              echo "Container exists but not running"
              echo "ECI_STATUS=not_exist" >> $GITHUB_ENV
            fi
          else
            echo "No container found"
            echo "ECI_STATUS=not_exist" >> $GITHUB_ENV
          fi

      - name: Create New ECI Instance
        if: env.ECI_STATUS == 'not_exist'
        run: |
          echo "Creating new ECI instance..."
          
          # Create container group and capture the output
          create_output=$(aliyun eci CreateContainerGroup \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupName ${{ secrets.ECI_CONTAINER_NAME }} \
            --Container.1.Image ${{ env.FULL_IMAGE_NAME_WITH_TAG }} \
            --Container.1.Name ${{ secrets.ECI_CONTAINER_NAME }} \
            --Container.1.Cpu ${{ secrets.ECI_CPU }} \
            --Container.1.Memory ${{ secrets.ECI_MEMORY }} \
            --VSwitchId ${{ secrets.ECI_VSWITCH_ID }} \
            --SecurityGroupId ${{ secrets.ECI_SECURITY_GROUP_ID }} \
            --Container.1.Port.1.Port 80 \
            --Container.1.Port.1.Protocol TCP \
            --RestartPolicy Always \
            --output text cols=ContainerGroupId)

          # Debug output
          echo "Create output:"
          echo "$create_output"

          # Check for errors
          if echo "$create_output" | grep -q "error"; then
            echo "::error::Failed to create ECI instance: $create_output"
            exit 1
          fi

          # Extract container group ID from the output
          CONTAINER_GROUP_ID=$(echo "$create_output" | tail -n 1 | tr -d ' ')
          
          if [[ -z "$CONTAINER_GROUP_ID" ]] || [[ "$CONTAINER_GROUP_ID" == "----------------" ]]; then
            echo "::error::Failed to extract container group ID from response"
            echo "Raw response: $create_output"
            exit 1
          fi

          echo "New ECI instance created with ID: $CONTAINER_GROUP_ID"
          echo "CONTAINER_GROUP_ID=$CONTAINER_GROUP_ID" >> $GITHUB_ENV

          # Wait for the container to be running
          echo "Waiting for container to be running..."
          max_attempts=30
          for i in $(seq 1 $max_attempts); do
            # Get container status using DescribeContainerGroups
            status=$(aliyun eci DescribeContainerGroups \
              --RegionId ${{ secrets.ALIBABA_REGION }} | \
              jq -r '.ContainerGroups[] | select(.ContainerGroupName == "'${{ secrets.ECI_CONTAINER_NAME }}'") | .Status')
            
            if [[ "$status" == "Running" ]]; then
              echo "Container is now running"
              break
            elif [[ "$status" == "Failed" ]]; then
              echo "::error::Container failed to start"
              exit 1
            elif [[ -z "$status" ]]; then
              echo "::error::Failed to get container status"
              exit 1
            fi
            
            echo "Container status: $status (attempt $i/$max_attempts)"
            sleep 10
          done

          if [[ "$status" != "Running" ]]; then
            echo "::error::Container did not reach running state after $max_attempts attempts"
            exit 1
          fi

      - name: Update Existing ECI Instance
        if: env.ECI_STATUS == 'Running'
        run: |
          echo "Updating existing ECI instance..."
          echo "Container Group ID: ${{ env.CONTAINER_GROUP_ID }}"
          echo "New Image: ${{ env.FULL_IMAGE_NAME_WITH_TAG }}"

          update_output=$(aliyun eci UpdateContainerGroup \
            --RegionId ${{ secrets.ALIBABA_REGION }} \
            --ContainerGroupId ${{ env.CONTAINER_GROUP_ID }} \
            --Container.1.Image ${{ env.FULL_IMAGE_NAME_WITH_TAG }} \
            --Container.1.Name ${{ secrets.ECI_CONTAINER_NAME }} 2>&1)

          if echo "$update_output" | grep -q "error"; then
            echo "::error::Failed to update ECI instance: $update_output"
            exit 1
          fi

          echo "ECI instance updated successfully"

      - name: Verify ECI Status
        if: env.CONTAINER_GROUP_ID != '' && env.CONTAINER_GROUP_ID != '----------------'
        run: |
          echo "Checking final status of ECI instance..."
          status=$(aliyun eci DescribeContainerGroups \
            --RegionId ${{ secrets.ALIBABA_REGION }} | \
            jq -r '.ContainerGroups[] | select(.ContainerGroupName == "'${{ secrets.ECI_CONTAINER_NAME }}'") | .Status')

          if [[ -z "$status" ]]; then
            echo "::error::Failed to check ECI status"
            exit 1
          fi

          echo "Final ECI status: $status"
      ## end of file