name: Deploy to Alibaba Cloud ECI

on:
  push:
    branches:
      - ali
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: https://registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr
          region-id: 'ap-northeast-1'
          access-key-id: ${{ secrets.ALIBABA_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }}
          username: "${{ secrets.ACR_USERNAME }}"
          password: "${{ secrets.ACR_PASSWORD }}"
      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG .
          docker push registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:$IMAGE_TAG

      - name: Install Alibaba Cloud CLI
        run: |
          curl -L https://aliyuncli.alicdn.com/install.sh | bash
          echo "$HOME/.aliyuncli/bin" >> $GITHUB_PATH

      - name: Configure Alibaba Cloud CLI
        run: |
          aliyun configure set --profile default --access-key-id ${{ secrets.ALIBABA_ACCESS_KEY_ID }} --access-key-secret ${{ secrets.ALIBABA_ACCESS_KEY_SECRET }} --region ${{ secrets.ALIBABA_REGION }}

      # - name: Install and verify Alibaba Cloud CLI
      #   run: |
      #     curl -sL https://acs-install-cn-hangzhou.oss-cn-hangzhou.aliyuncs.com/aliyun-cli/install.sh | sh aliyun version

      - name: Deploy to ECI
        run: |
          eci_instance_id=$(aliyun eci create-container-group \
            --region ${{ secrets.ALIBABA_REGION }} \
            --vswitch-id ${{ secrets.ECI_VSWITCH_ID }} \
            --security-group-id ${{ secrets.ECI_SECURITY_GROUP_ID }} \
            --container.1.image registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:${{ env.IMAGE_TAG }} \
            --container.1.name ${{ secrets.ECI_CONTAINER_NAME }} \
            --cpu ${{ secrets.ECI_CPU }} \
            --memory ${{ secrets.ECI_MEMORY }} \
            --output json | jq -r '.ContainerGroupId')
          echo "ECI Instance ID: $eci_instance_id"

      - name: Check ECI Status
        run: |
          aliyun eci describe-container-group --region ${{ secrets.ALIBABA_REGION }} --container-group-id $eci_instance_id

      - name: Deploy to ECI
        run: |
          eci_instance_id=$(aliyun eci create-container-group \
            --region ${{ secrets.ALIBABA_REGION }} \
            --vswitch-id ${{ secrets.ECI_VSWITCH_ID }} \
            --security-group-id ${{ secrets.ECI_SECURITY_GROUP_ID }} \
            --container.1.image registry-intl.ap-northeast-1.aliyuncs.com/demogc/demoacr:${{ env.IMAGE_TAG }} \
            --container.1.name ${{ secrets.ECI_CONTAINER_NAME }} \
            --cpu ${{ secrets.ECI_CPU }} \
            --memory ${{ secrets.ECI_MEMORY }} \
            --output json | jq -r '.ContainerGroupId')
          echo "ECI Instance ID: $eci_instance_id"

      - name: Check ECI Status
        run: |
          aliyun eci describe-container-group --region ${{ secrets.ALIBABA_REGION }} --container-group-id $eci_instance_id

