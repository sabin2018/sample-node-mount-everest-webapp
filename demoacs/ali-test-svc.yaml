apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-zone-maps: "ap-northeast-1a:vsw-6weybqwav8vgbjxiy8gm8,ap-northeast-1b:vsw-6we6ar0244nc03t2zz95o" # Example: cn-hangzhou-k:vsw-i123456,cn-hangzhou-j:vsw-j654321.
  name: ali-test-svc
  namespace: default
spec:
  ports:
  - name: tcp
    port: 80
    protocol: TCP
    targetPort: 80
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  selector:
    app: test
  loadBalancerClass: "alibabacloud.com/nlb"
  type: LoadBalancer
